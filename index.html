<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘 할 일</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen text-slate-950">
  <main class="mx-auto w-full max-w-3xl px-4 py-8 sm:px-6 sm:py-14">
    <section class="todo-panel overflow-hidden" aria-labelledby="app-title">
      <header class="flex items-end justify-between gap-4 px-5 pb-5 pt-6 sm:px-8 sm:pt-8">
        <div>
          <p class="mb-2 text-xs font-bold uppercase tracking-[.18em] text-coral">오늘의 흐름</p>
          <h1 id="app-title" class="text-3xl font-black leading-none sm:text-4xl">오늘 할 일</h1>
        </div>
        <div class="shrink-0 text-right" aria-live="polite">
          <strong id="progress-text" class="block text-2xl font-black text-indigo">0%</strong>
          <span class="text-xs font-medium text-slate-500">완료</span>
        </div>
      </header>

      <div class="mx-5 h-2 overflow-hidden rounded-sm bg-stone-200 sm:mx-8" role="progressbar" aria-label="할 일 완료율" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progress-bar" class="h-full w-0 bg-indigo transition-[width] duration-300"></div>
      </div>

      <div class="px-5 py-6 sm:px-8">
        <form id="todo-form" class="flex gap-2" novalidate>
          <label class="sr-only" for="todo-input">할 일</label>
          <input id="todo-input" class="min-w-0 flex-1 rounded-md border-2 border-slate-950 bg-white px-4 py-3 text-base outline-none transition focus:border-indigo" type="text" placeholder="할 일을 입력하세요" autocomplete="off">
          <button class="shrink-0 rounded-md bg-slate-950 px-5 py-3 text-sm font-bold text-white transition hover:bg-indigo" type="submit">추가</button>
        </form>
        <p id="input-error" class="mt-2 text-sm font-medium text-red-700" role="alert" hidden>할 일을 입력해 주세요.</p>

        <nav id="filters" class="mt-5 grid grid-cols-3 border-b border-slate-200" aria-label="할 일 필터">
          <button class="filter-button active" type="button" data-filter="all" aria-pressed="true">전체</button>
          <button class="filter-button" type="button" data-filter="active" aria-pressed="false">진행 중</button>
          <button class="filter-button" type="button" data-filter="completed" aria-pressed="false">완료</button>
        </nav>

        <ul id="todo-list" class="mt-5 space-y-2" aria-live="polite"></ul>
        <div id="empty-state" class="empty-state flex min-h-56 flex-col items-center justify-center text-center" hidden>
          <div class="empty-check mb-4 grid place-items-center" aria-hidden="true">✓</div>
          <p id="empty-message" class="font-bold">등록된 할 일이 없습니다.</p>
          <p class="mt-1 text-sm text-slate-500">새로운 할 일을 추가해보세요!</p>
        </div>
      </div>
    </section>
  </main>

  <template id="todo-template">
    <li class="todo-item flex items-start gap-3 rounded-md border border-slate-200 bg-white p-3 sm:p-4">
      <input class="todo-check mt-1 h-5 w-5 shrink-0 cursor-pointer" type="checkbox">
      <span class="todo-text min-w-0 flex-1 break-words py-0.5 leading-6"></span>
      <button class="delete-button shrink-0 rounded-md px-2.5 py-1.5 text-xs font-bold" type="button">삭제</button>
    </li>
  </template>
  <script src="script.js"></script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘 할 일</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container py-4 py-md-5">
    <section class="todo-shell mx-auto" aria-labelledby="app-title">
      <header class="d-flex align-items-end justify-content-between gap-3 mb-4">
        <div>
          <p class="eyebrow mb-1">DAILY PLAN</p>
          <h1 id="app-title" class="h2 mb-0 fw-bold">오늘 할 일</h1>
        </div>
        <div class="progress-copy text-end" aria-live="polite">
          <strong id="progress-text">0%</strong>
          <span class="d-block text-secondary">완료</span>
        </div>
      </header>

      <div class="progress mb-4" role="progressbar" aria-label="할 일 완료율" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="progress-bar" class="progress-bar"></div>
      </div>

      <form id="todo-form" class="row g-2 mb-3" novalidate>
        <div class="col">
          <label class="visually-hidden" for="todo-input">할 일</label>
          <input id="todo-input" class="form-control form-control-lg" type="text" placeholder="할 일을 입력하세요" autocomplete="off">
        </div>
        <div class="col-auto">
          <button class="btn btn-primary btn-lg px-3" type="submit" aria-label="할 일 추가">추가</button>
        </div>
      </form>
      <p id="input-error" class="text-danger small mb-3" role="alert" hidden>할 일을 입력해 주세요.</p>

      <nav class="nav nav-pills mb-4" id="filters" aria-label="할 일 필터">
        <button class="nav-link active" type="button" data-filter="all" aria-pressed="true">전체</button>
        <button class="nav-link" type="button" data-filter="active" aria-pressed="false">진행 중</button>
        <button class="nav-link" type="button" data-filter="completed" aria-pressed="false">완료</button>
      </nav>

      <ul id="todo-list" class="list-unstyled mb-0" aria-live="polite"></ul>
      <div id="empty-state" class="empty-state text-center py-5" hidden>
        <div class="empty-mark mx-auto mb-3" aria-hidden="true">✓</div>
        <p id="empty-message" class="fw-semibold mb-1">등록된 할 일이 없습니다.</p>
        <p class="text-secondary mb-0 small">새로운 할 일을 추가해보세요!</p>
      </div>
    </section>
  </main>

  <template id="todo-template">
    <li class="todo-item d-flex align-items-start gap-3 p-3 mb-2">
      <input class="form-check-input todo-check mt-1" type="checkbox">
      <span class="todo-text flex-grow-1"></span>
      <button class="btn btn-delete" type="button" aria-label="할 일 삭제">삭제</button>
    </li>
  </template>
  <script src="script.js"></script>
</body>
</html>
